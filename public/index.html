<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <!-- referrer: 同源與外連請求之 Referer 只送 origin(不含路徑與 ?token= 查詢), 權杖不經 Referer 進入伺服端 log 與反向代理 access log(縱深防禦, ADR-033) -->
        <meta name="referrer" content="strict-origin">
        <title></title>

        <!-- mdi font -->
        <link _href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">

        <!-- fontawesome -->
        <link _href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css" rel="stylesheet">

        <!-- ___pmwapi___ -->
        <script>
            window.___pmwapi___={
                urlRedirect: '{urlRedirect}',
            }
        </script>

        <!-- ___pmwperm___ -->
        <script>
            window.___pmwperm___={
                language: '{language}',
            }
        </script>

    </head>
    <body style="font-family:'Microsoft JhengHei','Avenir','Helvetica', 'Arial', 'sans-serif'; padding:0px; margin:0px;">
        <noscript>
            <strong>We're sorry but w-component-vue doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
        <div id="app"></div>
        <!-- built files will be auto injected -->
    </body>
</html>
